---
# tasks file for mod-xilinxsrv
- name: Reboot
  become: 'yes'
  ansible.builtin.reboot:

- name: DHCP client for wlan0
  become: 'yes'
  shell: |
    killall dhclient
    dhclient wlan0

- name: Apt update
  become: 'yes'
  ansible.builtin.apt:
    upgrade: 'yes'
    update_cache: 'yes'
    cache_valid_time: 86400

- name: Install packages
  become: 'yes'
  ansible.builtin.apt:
    pkg: "{{ packages }}"
    state: present
    cache_valid_time: 86400

- name: Check /x86 exists
  stat:
    path: /x86
  register: x86_exists

- name: Setup chroot for qemu
  block:

    - name: Create folder /x86
      ansible.builtin.file:
        path: /x86
        state: directory

    - name: Execute debootstrap on /x86
      command:
        cmd: debootstrap --arch amd64 bookworm /x86 http://deb.debian.org/debian

    - name: Copy qemu-x86_64-static over to /x86/usr/bin
      ansible.builtin.copy:
        src: /usr/bin/qemu-x86_64-static
        dest: /x86/usr/bin/
        remote_src: yes
        mode: '0755'

    - name: Chroot package update
      shell: |
        chroot /x86 qemu-x86_64-static /bin/bash -c "apt update"

    - name: Chroot package install
      shell: |
        chroot /x86 qemu-x86_64-static /bin/bash -c "apt install -y ncurses-dev libncurses5 libncurses5-dev libncursesw5-dev libtinfo5 libx11-6 libxext6 libxtst6 libgtk2.0-0 libglib2.0-0 libstdc++6"

    - name: Create folder /x86/xilinx
      ansible.builtin.file:
        path: /x86/xilinx
        state: directory

    - name: Turn off ser2net
      ansible.builtin.copy:
        src: ser2net.yaml
        dest: /etc/ser2net.yaml
 
  when: x86_exists.stat.exists == False
  become: 'yes'

