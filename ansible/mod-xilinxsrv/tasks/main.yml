## Xilinx Lab Edition 2024.1

    - name: Copy Vivado Lab edition to CTRL board
      ansible.builtin.copy:
        src: downloads/Vivado_Lab_Lin_2024.1_0522_2023.tar.gz
        dest: /x86/root/

    - name: Copy Vivado Lab config
      copy:
        src: install_config_24.1.txt
        dest: /x86/root/install_config.txt

    - name: Unpack Vivado Lab
      shell: |
        cd /x86/root
        tar xzf Vivado_Lab_Lin_*.tar.gz

    - name: Install Vivado Lab
      shell: |
        chroot /x86 qemu-x86_64-static /bin/bash -c "/root/Vivado_Lab_Lin_2024.1*/xsetup -a XilinxEULA,3rdPartyEULA -b Install -c /root/install_config.txt -l /xilinx &> vivado_install.log"

    - name: Remove Vivado Lab tarball
      shell: |
        rm -f /x86/root/Vivado_Lab_Lin_*.tar.gz

    - name: Copy hw_server.sh
      ansible.builtin.copy:
        src: hw_server_24.1.sh
        dest: /usr/bin/hw_server.sh
        mode: '0755'
 
    - name: Copy hw_server.service
      ansible.builtin.copy:
        src: hw_server.service
        dest: /etc/systemd/system/hw_server.service
        owner: root
        group: root

    - name: Systemd reload daemon
      ansible.builtin.systemd:
        daemon_reload: 'yes'

    - name: Readme
      copy:
        src: README_xilinxsrv.md
        dest: /home/pi/
        owner: pi
        group: pi
        mode: '0644'

  when: systemd_hw_server_exists.stat.exists == False  
  become: 'yes'

- name: All done!
  debug:
    msg: Vivado Lab Edition / hw_server installed
